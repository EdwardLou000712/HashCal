<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tools Session Tracker v2</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 650px; 
            margin: 2rem auto; 
            padding: 1rem; 
            background: #f0f2f5; 
            color: #1a1a1b;
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); 
        }
        h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .section-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 1rem; display: block; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="file"] { 
            width: 100%; 
            padding: 0.7rem; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box;
            background: #f8fafc;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 1rem; }
        button { 
            flex: 1;
            background: #4f46e5; 
            color: white; 
            border: none; 
            padding: 0.8rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background: #4338ca; transform: translateY(-1px); }
        button.secondary { background: #64748b; }
        button.secondary:hover { background: #475569; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
        
        #downloadBtn { background: #10b981; display: none; margin-top: 10px; }
        #downloadBtn:hover { background: #059669; }

        pre { 
            background: #0f172a; 
            color: #38bdf8; 
            padding: 1.2rem; 
            border-radius: 8px; 
            overflow-x: auto; 
            font-size: 0.85rem;
            border: 1px solid #334155;
            min-height: 40px;
        }
        .import-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>PTX Session Manager</h2>

        <div class="import-box">
            <span class="section-label">1. Link to Lineage (Optional)</span>
            <label for="importJson">Import previous .json credential:</label>
            <input type="file" id="importJson" accept=".json" onchange="importParentId()">
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 5px;">This automatically sets the Parent ID from your last saved version.</p>
        </div>

        <span class="section-label">2. Create New Version</span>
        <div class="form-group">
            <label for="fileInput">New .ptx Session File:</label>
            <input type="file" id="fileInput" accept=".ptx">
        </div>
        
        <div class="form-group">
            <label for="parentId">Parent Session ID:</label>
            <input type="text" id="parentId" placeholder="Manual entry or auto-filled by import">
        </div>
        
        <div class="form-group">
            <label for="description">Version Notes:</label>
            <input type="text" id="description" placeholder="e.g. Adjusted vocal levels in bridge">
        </div>
        
        <button id="generateBtn" onclick="generateCredential()">Generate & Hash</button>

        <h3 style="margin-top: 2rem; font-size: 1rem; color: #475569;">Credential Result:</h3>
        <pre id="output">// Result will appear here...</pre>
        <button id="downloadBtn" onclick="downloadJson()">Download Credential (.json)</button>
    </div>

    <script>
        let currentCredential = null;

        // Function to read a JSON file and extract the session_id
        function importParentId() {
            const file = document.getElementById('importJson').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.session_id) {
                        document.getElementById('parentId').value = data.session_id;
                        alert("Lineage Linked! Parent ID has been updated.");
                    } else {
                        alert("Error: Selected JSON does not contain a valid session_id.");
                    }
                } catch (err) {
                    alert("Error parsing JSON file.");
                }
            };
            reader.readAsText(file);
        }

        // Web Crypto API SHA-256
        async function calculateSHA256(file) {
            const arrayBuffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function generateCredential() {
            const fileInput = document.getElementById('fileInput');
            const parentId = document.getElementById('parentId').value.trim();
            const description = document.getElementById('description').value.trim();
            const output = document.getElementById('output');
            const downloadBtn = document.getElementById('downloadBtn');

            if (fileInput.files.length === 0) {
                alert('Please select a Pro Tools (.ptx) file.');
                return;
            }

            output.textContent = "Calculating cryptographic hash (this may take a moment for large files)...";
            downloadBtn.style.display = "none";

            try {
                const file = fileInput.files[0];
                const fileHash = await calculateSHA256(file);
                
                currentCredential = {
                    session_id: crypto.randomUUID(),
                    parent_id: parentId || null,
                    timestamp: new Date().toISOString(),
                    file_hash: fileHash,
                    file_name: file.name,
                    description: description
                };

                output.textContent = JSON.stringify(currentCredential, null, 4);
                downloadBtn.style.display = "block";
            } catch (error) {
                output.textContent = "Error: " + error.message;
            }
        }

        // Function to download the result as a file
        function downloadJson() {
            if (!currentCredential) return;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentCredential, null, 4));
            const downloadAnchorNode = document.createElement('a');
            
            // Format filename: session_v2_2023-10-27.json
            const date = new Date().toISOString().split('T')[0];
            const fileName = `session_credential_${date}.json`;
            
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
